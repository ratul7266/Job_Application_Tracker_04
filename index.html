<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Application Tracker</title>
    <!-- daisy UI -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- font style  -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <!-- font awsome  -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- <style>
      *{
            background-color: #f8f8f8;
        }
    </style> -->
  </head>
  <body class="py-14 mx-auto container">
    <header>
      <h1 class="text-2xl text-[#002c5c] font-bold mb-5">
        Job Application Tracker
      </h1>
      <nav class="flex justify-between gap-4">
        <!-- <nav class="grid grid-cols-1 md:grid-cols-3 gap-4"> -->

        <div class="card card-border bg-neutral-50 w-96 border border-gray-200">
          <div class="card-body">
            <h2 class="card-title text-sm font-medium">Total</h2>
            <h2 class="card-title text-2xl font-bold text-[#002C5C]">0</h2>
          </div>
        </div>
        <div class="card card-border bg-neutral-50 w-96 border border-gray-200">
          <div class="card-body">
            <h2 class="card-title text-sm font-medium">Interview</h2>
            <h2 class="card-title text-2xl font-bold text-green-600">0</h2>
          </div>
        </div>
        <div class="card card-border bg-neutral-50 w-96 border border-gray-200">
          <div class="card-body">
            <h2 class="card-title text-sm font-medium">Rejected</h2>
            <h2 class="card-title text-2xl font-bold text-red-600">0</h2>
          </div>
        </div>
      </nav>
    </header>
    <hr class="my-8 text-neutral-200" />
    
  </body>
</html>
